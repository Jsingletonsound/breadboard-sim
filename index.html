rent. Flip it back.`,x:`auto`,expect:{dark:[`lf`]},check:`connectivity`},{id:`A8`,t:`Test 2: move the short leg one strip`,d:`LED back the right way, then move its short leg from 57c to 56c.`,rm:[`lf`],add:[`l6`],q:`lit or dark?`,why:`Dark. Strip 56 doesn't touch strip 57, so the short leg no longer shares a strip with the jumper.`,x:`auto`,hi:[`s57`,`s56`],expect:{dark:[`l6`]},check:`connectivity`},{id:`A9`,t:`Test 3: move the jumper to match`,d:`Move the jumper from 57a to 56a.`,rm:[`w`],add:[`w6`],q:`lit or dark?`,why:`Lit. Parts connect only by sharing a strip.`,expect:{lit:{l6:7}},ro:`Same loop, same 7 mA`,hi:[`s58`,`s56`],check:`connectivity`},{id:`A10`,t:`Test 4: cross the center gap`,d:`Jumper back to 57a. Put the LED across the gap: long leg 58e, short leg 57f.`,rm:[`l6`,`w6`],add:[`lg`,`w`],q:`lit or dark?`,why:`Dark. The gap splits strip 57 in two: 57f is not connected to 57a.`,x:`auto`,hi:[`s57`,`S57`],expect:{dark:[`lg`]},check:`connectivity`},{id:`A11`,t:`Test 5: the far end of the − row`,d:`LED back in 58c and 57c. Move the jumper's rail end to the far end of the − row (drawn here at the right edge).`,rm:[`lg`,`w`],add:[`l`,`wf`],q:`lit or dark?`,why:`Lit on most boards: the − row runs the full length. If yours goes dark, the rail is split in the middle; bridge the two halves with a jumper, and tell the class.`,expect:{lit:{l:7}},ro:`Still 7 mA`,hi:[`R-`],check:`connectivity`}]},{id:`B`,title:`Resistor ladder`,minutes:12,mims:`14, 28–29`,parts:{l:{t:`L`,a:`58c`,k:`57c`,color:`red`},w:{t:`W`,a:`57a`,b:`-57`},r100:{t:`R`,a:`+58`,b:`58a`,v:`100K`},r10:{t:`R`,a:`+58`,b:`58a`,v:`10K`},r51:{t:`R`,a:`+58`,b:`58a`,v:`5.1K`},r2:{t:`R`,a:`+58`,b:`58a`,v:`2K`},r1:{t:`R`,a:`+58`,b:`58a`,v:`1K`},r330:{t:`R`,a:`+58`,b:`58a`,v:`330`}},steps:[{id:`B1`,t:`Start from first light`,d:`Same circuit as part A: red LED, 1K. Before you swap anything, predict the order from dimmest to brightest: 100K, 10K, 5.1K, 2K, 1K, 330. Write it down.`,add:[`r1`,`l`,`w`],pw:1,expect:{lit
